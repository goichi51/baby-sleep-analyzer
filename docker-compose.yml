services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app 
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true 
      - DATABASE_URL=mysql2://app:app_password@db:3306/sleep_analyzer
      - TZ=Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy 
      migration:
        condition: service_completed_successfully
    
  migration:
    build: .
    command: npx drizzle-kit migrate
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=mysql2://app:app_password@db:3306/sleep_analyzer
      - TZ=Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy 

  db:
    image: mysql:8.0
    container_name: mysql_db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci # クライアント接続互換性のため
    ports:
      - "3306:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: sleep_analyzer        
      MYSQL_USER: app 
      MYSQL_PASSWORD: app_password
      TZ: "Asia/Tokyo"
    volumes:
      - db-data:/var/lib/mysql 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    
volumes:
  db-data: